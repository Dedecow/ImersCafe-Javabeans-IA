deepseek:
  endpoint: ${DEEPSEEK_ENDPOINT:https://api.deepseek.com}
  key: ${DEEPSEEK_API_KEY:}
  # Tempo máximo de espera pela IA (ex.: 15s, 500ms); depois disso o jogo segue sem o texto da IA
  timeout: ${DEEPSEEK_TIMEOUT:15s}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    # Não segura conexão com o banco durante a requisição inteira (inclusive a espera pela IA)
    open-in-view: false
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: 2
      # Falha rápido (5 s) em vez de deixar o jogador esperando 30 s por uma conexão
      connection-timeout: 5000

logging:
  file:
    name: logs/javabeans-ia.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
  pattern:
    # ID da requisição em cada linha do log
    level: "%5p [%X{requisicao:-sistema}]"

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: always
